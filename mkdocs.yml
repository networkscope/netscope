site_name: NetScope
site_description: Open-source cybersecurity reconnaissance and analysis platform
site_url: https://networkscope.github.io/netscope
repo_url: https://github.com/networkscope/netscope
repo_name: networkscope/netscope

theme:
  name: material
  palette:
    scheme: default
    primary: indigo
    accent: blue
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tilde
  - pymdownx.emoji

nav:
  - Home: index.md
  - Architecture: architecture.md
  - CLI Reference: cli.md
  - API Reference: api.md
  - Development: development.md
  - Security: security.md
  - OpenAPI: openapi.yaml

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/networkscope/netscope