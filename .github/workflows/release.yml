name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Generate timestamp tag
        id: tag
        run: |
          TAG="v$(date +%Y).$(date +%-m).$(date +%-d)-$(date +%H%M)"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
      - name: Create Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "${{ steps.tag.outputs.tag }}" -m "Release ${{ steps.tag.outputs.tag }}" -f
          git push origin "${{ steps.tag.outputs.tag }}" -f
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.5.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
