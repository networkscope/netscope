name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - run: go mod tidy
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go test -bench=. -benchmem ./internal/assets ./internal/core

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - name: Build Linux amd64
        run: GOOS=linux GOARCH=amd64 go build -o netscope-linux-amd64 ./cmd/netscope
      - name: Build Linux arm64
        run: GOOS=linux GOARCH=arm64 go build -o netscope-linux-arm64 ./cmd/netscope
      - uses: actions/upload-artifact@v4
        with:
          name: netscope-linux
          path: |
            netscope-linux-amd64
            netscope-linux-arm64

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - name: Build Windows amd64
        run: go build -o netscope-windows-amd64.exe ./cmd/netscope
      - name: Build Windows arm64
        run: go build -o netscope-windows-arm64.exe ./cmd/netscope
      - uses: actions/upload-artifact@v4
        with:
          name: netscope-windows
          path: |
            netscope-windows-amd64.exe
            netscope-windows-arm64.exe

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - name: Build macOS amd64
        run: GOOS=darwin GOARCH=amd64 go build -o netscope-darwin-amd64 ./cmd/netscope
      - name: Build macOS arm64
        run: GOOS=darwin GOARCH=arm64 go build -o netscope-darwin-arm64 ./cmd/netscope
      - uses: actions/upload-artifact@v4
        with:
          name: netscope-macos
          path: |
            netscope-darwin-amd64
            netscope-darwin-arm64

  goreleaser:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - name: Install GoReleaser
        run: |
          curl -sL https://github.com/goreleaser/goreleaser/releases/download/v2.5.0/goreleaser_linux_amd64.tar.gz | tar xz
      - name: Run GoReleaser
        run: ./goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}